name: Build PES 2013 Android APK

on:
  push:
    branches: [android-clean-restart, fix/shader-guard, port-pes13-mobile]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    env:
      NDK_VERSION: "26.2.11394342"
      ANDROID_API: "26"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android SDK command-line tools
        run: |
          set -e
          # Ubuntu 22.04 ships SDK tools at a known location
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "$CMDLINE_URL" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unzip
          mv /tmp/cmdline-unzip/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT"     >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools"            >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          set -e
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${{ env.NDK_VERSION }}" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3 python3-pip \
            nasm yasm pkg-config \
            libvulkan-dev \
            clang lld ccache

      - name: Install CMake 3.28.3
        run: |
          set -e
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          /usr/local/bin/cmake --version

      - name: Cache thirdparty clones
        id: cache-tp
        uses: actions/cache@v4
        with:
          path: |
            rexsdk/thirdparty/FFmpeg
            rexsdk/thirdparty/sdl3
            rexsdk/thirdparty/simde
            rexsdk/thirdparty/glslang
            rexsdk/thirdparty/vulkan-headers
            rexsdk/thirdparty/vulkan-loader
            rexsdk/thirdparty/vulkan-memory-allocator
            rexsdk/thirdparty/spirv-headers
            rexsdk/thirdparty/spirv-tools
            rexsdk/thirdparty/tracy
            rexsdk/thirdparty/fmt
            rexsdk/thirdparty/spdlog
            rexsdk/thirdparty/catch2
            rexsdk/thirdparty/moltenvk
          key: rexsdk-tp-v8-${{ runner.os }}

      - name: Clone large thirdparty deps (if not cached)
        if: steps.cache-tp.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/rexsdk
        run: |
          set -e
          mkdir -p thirdparty
          cd thirdparty
          clone_if_missing() {
            local name=$1 url=$2 tag=$3
            [ -d "$name" ] && return 0
            echo "==> Cloning $name ($tag)..."
            git clone --depth=1 ${tag:+--branch "$tag"} "$url" "$name" 2>&1 | tail -2
          }
          clone_if_missing FFmpeg         https://github.com/xenia-project/FFmpeg             master
          clone_if_missing sdl3           https://github.com/libsdl-org/SDL                   release-3.2.x
          clone_if_missing simde          https://github.com/simd-everywhere/simde             v0.8.2
          clone_if_missing glslang        https://github.com/KhronosGroup/glslang              vulkan-sdk-1.3.268.0
          clone_if_missing vulkan-headers https://github.com/KhronosGroup/Vulkan-Headers       vulkan-sdk-1.3.268.0
          clone_if_missing vulkan-loader  https://github.com/KhronosGroup/Vulkan-Loader        vulkan-sdk-1.3.268.0
          clone_if_missing vulkan-memory-allocator \
                                          https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator v3.3.0
          clone_if_missing spirv-headers  https://github.com/KhronosGroup/SPIRV-Headers        vulkan-sdk-1.3.268.0
          clone_if_missing spirv-tools    https://github.com/KhronosGroup/SPIRV-Tools          vulkan-sdk-1.3.268.0
          clone_if_missing tracy          https://github.com/wolfpld/tracy                     v0.13.1
          clone_if_missing fmt            https://github.com/fmtlib/fmt                        10.1.1
          clone_if_missing spdlog         https://github.com/gabime/spdlog                     v1.12.0
          clone_if_missing catch2         https://github.com/catchorg/Catch2                   v3.4.0
          clone_if_missing moltenvk       https://github.com/KhronosGroup/MoltenVK             v1.2.9
          echo "All clones done."
          ls -la

      - name: Patch glslang (createAccessChain)
        run: python3 tools/patch_glslang.py rexsdk/thirdparty/glslang/SPIRV/SpvBuilder.cpp

      - name: Set workspace paths
        run: |
          echo "PES2013_ROOT=${{ github.workspace }}/pes2013"  >> $GITHUB_ENV
          echo "REXSDK_DIR=${{ github.workspace }}/rexsdk"     >> $GITHUB_ENV

      - name: Verify layout
        run: |
          echo "--- PES2013 generated dir ---"
          ls "$PES2013_ROOT/generated/default/" | head -10
          echo "(total $(ls "$PES2013_ROOT/generated/default/" | wc -l) files)"
          echo "--- REXSDK include ---"
          ls "$REXSDK_DIR/include/" | head -10
          echo "--- REXSDK thirdparty ---"
          ls "$REXSDK_DIR/thirdparty/" | head -20
          echo "--- Android gradle wrapper ---"
          ls "${{ github.workspace }}/android/gradle/wrapper/"

      - name: Make gradlew executable
        run: chmod +x "${{ github.workspace }}/android/gradlew"

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "${{ github.workspace }}/android/local.properties"
          echo "cmake.dir=/usr/local" >> "${{ github.workspace }}/android/local.properties"
          cat "${{ github.workspace }}/android/local.properties"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/gradle-wrapper.properties') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build debug APK
        working-directory: ${{ github.workspace }}/android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME:     ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          PES2013_ROOT:     ${{ env.PES2013_ROOT }}
          REXSDK_DIR:       ${{ env.REXSDK_DIR }}
          GRADLE_OPTS:      "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g"
          PES_USE_CCACHE:   "1"
          CCACHE_DIR:       /home/runner/.cache/ccache
          CCACHE_BASEDIR:   ${{ github.workspace }}
          CCACHE_MAXSIZE:   "3G"
          CCACHE_COMPRESS:  "1"
          CCACHE_SLOPPINESS: "time_macros,pch_defines"
        run: |
          set -e
          set -o pipefail
          ccache --zero-stats || true
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          ccache --show-stats || true

      - name: Report build errors
        if: failure()
        working-directory: ${{ github.workspace }}/android
        run: |
          python3 - <<'PY' || true
          import re, os
          t = open('build.log', errors='replace').read().split('\n') if os.path.exists('build.log') else []
          errs = [l for l in t if re.search(r'error:|undefined reference|FAILED|What went wrong|fatal error|ld.lld: error', l)]
          msg = '\n'.join(errs[:25]) or '\n'.join(t[-25:])
          msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Build errors::' + msg[:6000])
          PY

      - name: Find APK
        id: find_apk
        run: |
          set -euo pipefail
          APK=$(find "${{ github.workspace }}/android/app/build/outputs/apk" -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::error::Nenhum APK produzido"
            exit 1
          fi
          echo "path=$APK"  >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Gerar metadados e inspecionar APK
        if: steps.find_apk.outputs.found == 'true'
        id: meta
        run: |
          set -euo pipefail
          APK="${{ steps.find_apk.outputs.path }}"
          OUT="${{ github.workspace }}/artifact-out"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/app-debug.apk"
          cp "${{ github.workspace }}/android/build.log" "$OUT/build.log" || true
          SHA=$(sha256sum "$OUT/app-debug.apk" | cut -d' ' -f1)
          {
            echo "commit=${{ github.sha }}"
            echo "branch=${{ github.ref_name }}"
            echo "run_number=${{ github.run_number }}"
            echo "run_id=${{ github.run_id }}"
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "ndk=${{ env.NDK_VERSION }}"
            echo "api=${{ env.ANDROID_API }}"
            echo "size_bytes=$(stat -c %s "$OUT/app-debug.apk")"
            echo "sha256=$SHA"
          } > "$OUT/metadata.txt"
          echo "--- conteúdo do APK (dex e libs nativas)"
          unzip -l "$OUT/app-debug.apk" | grep -E "classes[0-9]*\.dex|\.so$" | tee "$OUT/apk_contents.txt"
          echo "--- ABIs"
          unzip -Z1 "$OUT/app-debug.apk" | grep '^lib/' | cut -d/ -f2 | sort -u | tee "$OUT/apk_abis.txt"
          echo "--- assinatura JNI nativeSetupJNI no DEX"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          mkdir -p /tmp/dex && unzip -q -o "$OUT/app-debug.apk" 'classes*.dex' -d /tmp/dex
          for d in /tmp/dex/classes*.dex; do
            "$BT/dexdump" -d "$d" 2>/dev/null | grep -A0 "nativeSetupJNI" | head -3 || true
          done | tee "$OUT/dex_nativeSetupJNI.txt"
          cat "$OUT/metadata.txt"
          echo "--- símbolos exportados nas libs arm64"
          NM=$(find "$ANDROID_SDK_ROOT" -name llvm-nm -path '*linux-x86_64*' 2>/dev/null | head -1 || true)
          mkdir -p /tmp/libs && unzip -q -o "$OUT/app-debug.apk" 'lib/arm64-v8a/*' -d /tmp/libs || true
          {
            echo "nm=$NM"
            for f in /tmp/libs/lib/arm64-v8a/*.so; do
              [ -e "$f" ] || continue
              echo "$(basename "$f") size=$(stat -c %s "$f") sha256=$(sha256sum "$f" | cut -c1-16)"
            done
            if [ -n "$NM" ]; then
              echo "libmain SDL_main/main: $("$NM" -D --defined-only /tmp/libs/lib/arm64-v8a/libmain.so 2>/dev/null | grep -E ' (SDL_main|main)$' | tr '\n' ';')"
              for g in /tmp/libs/lib/arm64-v8a/librexgpu-xenos*.so; do
                [ -e "$g" ] && echo "$(basename "$g") exports: $("$NM" -D --defined-only "$g" 2>/dev/null | grep -E 'rex_gpu_(abi_version|create)' | tr '\n' ';')"
              done
            fi
          } > "$OUT/native_symbols.txt" 2>&1 || true
          cat "$OUT/native_symbols.txt"
          python3 - "$OUT" <<'PY' || true
          import sys,os
          o=sys.argv[1]
          t=""
          for n in ("metadata.txt","apk_abis.txt","dex_nativeSetupJNI.txt","native_symbols.txt","apk_contents.txt"):
              f=os.path.join(o,n)
              if os.path.exists(f):
                  t+="## "+n+"\n"+open(f,errors="replace").read()+"\n"
          t=t[:30000].replace("%","%25").replace("\r","").replace("\n","%0A")
          print("::notice title=APK report::"+t)
          PY
          echo "dir=$OUT" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: steps.find_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pes2013-debug-apk-build${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.meta.outputs.dir }}
          retention-days: 60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/android/build.log
            ${{ github.workspace }}/android/app/.cxx/**
            ${{ github.workspace }}/android/app/build/intermediates/cmake/**

      - name: Create GitHub Release
        if: steps.find_apk.outputs.found == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "PES 2013 Android — Build #${{ github.run_number }}"
          body: |
            ## PES 2013 Android (ReXGlue native recompilation)

            **Build**: #${{ github.run_number }}
            **Commit**: ${{ github.sha }}

            ### Como instalar
            1. Habilite *Fontes desconhecidas* no Android
            2. Instale o APK
            3. Toque em **SELECIONAR PASTA** e escolha a pasta com `default.xex`
            4. Toque em **PLAY**

            ### Hardware alvo
            - SoC: MediaTek Helio G99
            - GPU: Mali-G57 MC2
            - ABI: arm64-v8a
            - Android mínimo: 8.0 (API 26)
          files: ${{ steps.meta.outputs.dir }}/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
